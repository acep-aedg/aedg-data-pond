resource:
  name: public_senate_districts
  title: Senate Districts
  summary: | 
      A statewide GeoJSON dataset defining spatial boundaries for Senate districts in Alaska.
  description: |
      This dataset provides geographic boundary polygons and attribute data for Alaska's Senate districts.
  path: "https://raw.githubusercontent.com/acep-aedg/aedg-data-pond/refs/heads/main/data/public/public_senate_districts/public_senate_districts.geojson"
  keywords:
    - government 
    - census
  topics:
    - Social
    - Geography 
  publisher: acep
  sources: # list of directory names in https://github.com/acep-aedg/aedg-etl-2024/tree/main/data-sources to get source.yml
    - dcra.senate_districts
  licenses: # list of keys in the license.yml registry
    - CC-BY-4.0
  spatial:
    name: Alaska
    boundingBox: [-187.55, 51.21, -130.0, 71.35]
    crs: OGC:CRS84
  temporal:
    referenceDate: "2022-05-24"  # equivalent to as_of_date
    timeseries: null # is a list of possibly multiple time periods
  primaryKey: # list of the fields that uniquely identifies each row in the table
    - district
  contributors:
    - organization: acep
      roles:
        - DataCurator
      date: 2025
      object: data via https://github.com/acep-aedg/aedg-etl-2024
      comment: |
        Identified data source and integrated it into the data pipeline.
