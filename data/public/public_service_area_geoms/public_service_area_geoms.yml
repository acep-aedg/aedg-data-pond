resource:
  name: public_service_area_geoms
  title: Electric Service Areas of Alaska (Individual Geometries)
  summary: |
    Electric service area boundaries broken into individual polygon features per physical territory.
  description: |
    Spatial file of electric service area polygons in Alaska, used in AEDG (Alaska Energy Data Gateway) to associate communities with infrastructure and sales reporting. Non-contiguous service boundaries assigned to a single utility CPCN are split into separate feature records.
  path: "https://raw.githubusercontent.com/acep-aedg/aedg-data-pond/refs/heads/main/data/public/public_service_area_geoms/public_service_area_geoms.geojson"
  keywords:
    - electricty
    - sales
    - grid
  topics:
    - Energy
    - Geography
    - Infrastructure
  publisher: acep
  sources:
    - acep.electric_service_areas
  licenses:
    - CC-BY-4.0
  spatial:
    name: Alaska
    boundingBox: [-187.55, 51.21, -130.0, 71.35]
    crs: OGC:CRS84
  temporal:
    referenceDate: "2026-01-01"
    timeseries: null
  primaryKey:
    - service_area_geom_id
  contributors:
